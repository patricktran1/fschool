name: Import FschoolAI and add Elon avatar

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  import-and-customize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone FschoolAI source
        run: git clone --depth 1 --branch frontend/dev https://github.com/joshmathur/FschoolAI-.git /tmp/fschool-source

      - name: Mirror source into fschool
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          rsync -a --delete --exclude=.git --exclude=.github /tmp/fschool-source/ ./

      - name: Add Elon Musk portrait
        run: |
          mkdir -p public
          curl --fail --location --retry 3 \
            "https://commons.wikimedia.org/wiki/Special:Redirect/file/Elon%20Musk%20Royal%20Society%20%28crop1%29.jpg?width=256" \
            --output public/elon-musk.jpg

      - name: Patch the internal header
        env:
          PATCH_SCRIPT: |
            from pathlib import Path

            app_path = next(
                (path for path in (Path("src/App.tsx"), Path("src/App.jsx")) if path.exists()),
                None,
            )
            if app_path is None:
                raise SystemExit("Could not find src/App.tsx or src/App.jsx")

            text = app_path.read_text(encoding="utf-8")

            css_lines = [
                "  .app-elon-avatar {",
                "    width: 36px;",
                "    height: 36px;",
                "    margin-left: 10px;",
                "    flex-shrink: 0;",
                "    border-radius: 50%;",
                "    object-fit: cover;",
                "    object-position: 50% 20%;",
                "    border: 1px solid rgba(196,154,60,0.42);",
                "    box-shadow: 0 0 0 3px rgba(196,154,60,0.08), 0 8px 22px rgba(0,0,0,0.32);",
                "    background: rgba(255,255,255,0.06);",
                "  }",
                "  @media (max-width: 480px) {",
                "    .app-elon-avatar {",
                "      width: 32px;",
                "      height: 32px;",
                "      margin-left: 8px;",
                "    }",
                "  }",
                "",
            ]
            css = "\n".join(css_lines)

            if ".app-elon-avatar {" not in text:
                css_anchor = "  .app-main {\n"
                if css_anchor not in text:
                    raise SystemExit("Could not find app-main CSS anchor")
                text = text.replace(css_anchor, css + css_anchor, 1)

            avatar_lines = [
                "            <img",
                "              className=\"app-elon-avatar\"",
                "              src=\"/elon-musk.jpg\"",
                "              alt=\"Elon Musk\"",
                "              title=\"Elon Musk\"",
                "            />",
            ]
            avatar = "\n".join(avatar_lines)

            if "src=\"/elon-musk.jpg\"" not in text:
                jsx_anchor = (
                    "              </motion.button>\n"
                    "            </div>\n\n"
                    "            {/* Panel — position:fixed, so parent stacking context doesn't matter */}\n"
                )
                if jsx_anchor not in text:
                    raise SystemExit("Could not find notification/header JSX anchor")
                replacement = (
                    "              </motion.button>\n"
                    "            </div>\n"
                    + avatar
                    + "\n\n"
                    "            {/* Panel — position:fixed, so parent stacking context doesn't matter */}\n"
                )
                text = text.replace(jsx_anchor, replacement, 1)

            app_path.write_text(text, encoding="utf-8")
            print(f"Patched {app_path}")
        run: python3 -c "$PATCH_SCRIPT"

      - name: Add image attribution
        run: |
          printf '%s\n' \
            '# Image attribution' \
            '' \
            '`public/elon-musk.jpg` is a resized copy of **Elon Musk Royal Society (crop1).jpg**.' \
            '' \
            '- Source: Wikimedia Commons' \
            '- Attribution: The Royal Society / Duncan.Hull' \
            '- License: Creative Commons Attribution-ShareAlike 3.0 Unported (CC BY-SA 3.0)' \
            '- Source page: https://commons.wikimedia.org/wiki/File:Elon_Musk_Royal_Society_(crop1).jpg' \
            '- License: https://creativecommons.org/licenses/by-sa/3.0/' \
            > IMAGE_ATTRIBUTION.md

      - name: Commit imported application
        run: |
          rm -f .github/workflows/import-fschoolai.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "fschool-import-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import FschoolAI and add Elon Musk avatar"
          git push origin HEAD:main
